services:
  - type: web
    name: aetheris-crm-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: "System Administrator"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
